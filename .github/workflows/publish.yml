name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0, 1.0.0-beta.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Required for npm Trusted Publishers (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11 (for Trusted Publishers)
        run: npm install -g npm@11  # npm 12 dropped Node 25 support

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run compile  # Only compile TypeScript, database is pre-built

      - name: Verify skills directory exists
        run: |
          if [ ! -d "skills" ]; then
            echo "❌ Error: skills/ directory not found"
            exit 1
          fi
          echo "✅ Skills directory found"
          ls -la skills/

      - name: Run tests
        run: pnpm test

      - name: Update version (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "${{ inputs.version }}" ]; then
            npm version ${{ inputs.version }} --no-git-tag-version
            echo "Updated version to ${{ inputs.version }}"
          else
            echo "Version is already ${{ inputs.version }}, skipping version update"
          fi

      - name: Publish to NPM (with Trusted Publishers)
        run: |
          # Skip when re-running a job whose npm publish already succeeded
          if npm view "$(node -p "require('./package.json').name + '@' + require('./package.json').version")" version >/dev/null 2>&1; then
            echo "Version already on npm, skipping"
          else
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to MCP Registry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # npm can take a few minutes to serve a new version; the registry validates against it
          for i in $(seq 1 20); do
            npm view "mozaic-mcp-server@$VERSION" version >/dev/null 2>&1 && break
            echo "Waiting for mozaic-mcp-server@$VERSION on npm ($i/20)..."
            sleep 30
          done
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # The registry is in preview and sometimes answers 5xx; retry
          for i in 1 2 3; do ./mcp-publisher publish && exit 0; sleep 30; done
          exit 1

      - name: Verify publication
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "✅ Published ${PACKAGE_NAME}@${PACKAGE_VERSION}"
          echo ""
          echo "Install: npx skills add MerzoukeMansouri/adeo-mozaic-mcp && npx add-mcp ${PACKAGE_NAME}@2 --name mozaic"
