name: Refresh Database

# Temporary: daily rebuild of data/mozaic.db from the upstream Mozaic repos.
# Commits only when the DB changes; that push triggers release.yml -> publish.yml.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-db
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT so the push triggers release.yml (GITHUB_TOKEN pushes don't trigger workflows)
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate git for private adeo/mozaic-* repos
        env:
          REPOS_TOKEN: ${{ secrets.MOZAIC_REPOS_TOKEN || secrets.GH_PAT }}
        run: git config --global url."https://x-access-token:${REPOS_TOKEN}@github.com/adeo/".insteadOf "https://github.com/adeo/"

      - name: Rebuild database from upstream Mozaic repos
        run: pnpm build

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/mozaic.db; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Database unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run sanity check
        if: steps.diff.outputs.changed == 'true'
        run: pnpm run database:sanity

      - name: Run tests
        if: steps.diff.outputs.changed == 'true'
        run: pnpm test

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mozaic.db
          git commit -m "fix(data): refresh Mozaic database from upstream repos"
          git push
