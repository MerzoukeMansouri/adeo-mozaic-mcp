name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    env:
      # Read access to the private adeo/mozaic-{vue,react,web-components,freemarker} repos
      REPOS_TOKEN: ${{ secrets.MOZAIC_REPOS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install shell script dependencies (sqlite3, jq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 jq

      - name: Rebuild native modules for current Node version
        run: pnpm rebuild better-sqlite3

      - name: Authenticate git for private adeo/mozaic-* repos
        if: env.REPOS_TOKEN != ''
        run: git config --global url."https://x-access-token:${REPOS_TOKEN}@github.com/adeo/".insteadOf "https://github.com/adeo/"

      # Skipped until MOZAIC_REPOS_TOKEN is set; tests then run on the committed DB
      - name: Rebuild database from upstream Mozaic repos
        if: env.REPOS_TOKEN != ''
        run: pnpm build

      - name: Run sanity check
        run: pnpm run database:sanity

      - name: Run tests with coverage
        run: pnpm test:coverage

